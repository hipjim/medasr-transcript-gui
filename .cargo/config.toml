## Project-wide cargo configuration. Checked into the repo so local
## builds and CI behave the same.
##
## Note on flag precedence: `RUSTFLAGS` env *overrides* the [build] /
## [target.*] rustflags here (it doesn't merge). CI workflows therefore
## must NOT set `RUSTFLAGS` — they let this file do the work.

[build]
# Treat all warnings as errors everywhere. Was previously set via
# `env: RUSTFLAGS: "-D warnings"` in the workflows; lives here so it
# composes cleanly with the per-target flags below.
rustflags = ["-D", "warnings"]

[target.x86_64-pc-windows-msvc]
# We tried `-C target-feature=+crt-static` in v0.1.1 and it caused
# silent crashes on launch. Root cause: sherpa-onnx-sys ships a
# prebuilt static C++ library that was built against the *dynamic*
# MSVC runtime (/MD). Linking Rust with /MT on top produces a binary
# with two C runtimes glued together; cross-runtime malloc/free
# corrupts the heap and the process dies during init.
#
# Fix: keep the dynamic CRT here, and ship vcruntime140.dll +
# msvcp140.dll alongside the .exe in the release archive (see
# .github/workflows/release.yml). End users get a self-contained
# folder; no Visual C++ Redistributable install needed.
#
# `-D warnings` is repeated because [target.<triple>] rustflags
# shadows [build] rustflags — they don't merge.
rustflags = ["-D", "warnings"]
