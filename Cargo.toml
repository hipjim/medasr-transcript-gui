[workspace]
resolver = "2"
members = [
    "crates/medasr-types",
    "crates/medasr-paths",
    "crates/medasr-secure-buffer",
    "crates/medasr-postprocess",
    "crates/medasr-state",
    "crates/medasr-audio",
    "crates/medasr-asr",
    "crates/medasr-inject",
    "crates/medasr-focus",
    "crates/medasr-permissions",
    "crates/medasr-hotkey",
    "crates/medasr-model",
    "crates/medasr-audit",
    "crates/medasr-settings",
    "crates/medasr-lifecycle",
    "crates/medasr-cli",
    "crates/medasr-gui",
]
# src-tauri is a future-alternative-frontend scaffold from Unit 1 that
# is NOT what we ship (we ship medasr-gui via eframe). Excluded from the
# workspace so it doesn't pull the heavy webkit/wry/tauri-winres dep
# chain into every CI build, and so Tauri's icon resource step (which
# still references the placeholder .ico from Unit 1) doesn't break
# Windows. Re-add to `members` if/when src-tauri becomes the shipping
# front-end.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
authors = ["MedASR Contributors"]
repository = "https://github.com/elostar/med-asr"
rust-version = "1.80"

[workspace.dependencies]
# Internal crates — used by sibling crates so they share versioning
medasr-types         = { path = "crates/medasr-types" }
medasr-paths         = { path = "crates/medasr-paths" }
medasr-secure-buffer = { path = "crates/medasr-secure-buffer" }
medasr-postprocess   = { path = "crates/medasr-postprocess" }
medasr-state         = { path = "crates/medasr-state" }
medasr-audio         = { path = "crates/medasr-audio" }
medasr-asr           = { path = "crates/medasr-asr" }
medasr-inject        = { path = "crates/medasr-inject" }
medasr-focus         = { path = "crates/medasr-focus" }
medasr-permissions   = { path = "crates/medasr-permissions" }
medasr-hotkey        = { path = "crates/medasr-hotkey" }
medasr-model         = { path = "crates/medasr-model" }
medasr-audit         = { path = "crates/medasr-audit" }
medasr-settings      = { path = "crates/medasr-settings" }
medasr-lifecycle     = { path = "crates/medasr-lifecycle" }

# External
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util  = { version = "0.7", features = ["rt"] }
tracing     = "0.1"
zeroize     = { version = "1", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs           = "allow"   # tighten later

[workspace.lints.clippy]
# Standard signal-rich lint set. clippy::pedantic was tried at scaffold
# time and removed because under CI's -D warnings it produced dozens of
# style-only errors per crate (doc_markdown wanting backticks around
# every acronym, must_use_candidate on every getter, cast_truncation on
# every i16->f32, etc.) and the set grows every Rust release. If a
# specific pedantic lint is worth catching, opt into it explicitly here.
all = { level = "warn", priority = -1 }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3

[profile.dev]
opt-level = 1
