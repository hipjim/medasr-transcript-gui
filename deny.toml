# cargo-deny configuration. Enforces:
#   - Apache-2.0 / MIT / BSD-3-Clause / Unicode-licensed deps only.
#   - Banned crates: tauri-plugin-updater (auto-update is intentionally absent).
#   - Banned crates outside their owner: reqwest/hyper/ureq must NOT appear
#     in any crate other than `medasr-model`. (cargo-deny does not enforce
#     per-crate rules; the per-crate enforcement lives in
#     `scripts/check-dep-dag.sh`.)

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    # Permissive code licenses.
    "Apache-2.0",
    # Apache-2.0 with LLVM exception — used by LLVM-derived crates
    # (e.g. tracing-attributes' wasi/zerocopy chain).
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # Linux Foundation Community Data License Agreement, Permissive 2.0 —
    # used by some webpki / rustls-related crates' embedded data.
    "CDLA-Permissive-2.0",
    # Boost Software License — used by clipboard-win (transitive dep
    # of egui via arboard). OSI-approved, FSF-Libre.
    "BSL-1.0",
    # Font licenses — pulled in by egui's bundled default fonts
    # (epaint_default_fonts).
    "OFL-1.1",          # SIL Open Font License 1.1
    "Ubuntu-font-1.0",  # Ubuntu Font Licence
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"

# Auto-updater is explicitly NOT compiled in, per the plan's "Network egress"
# decision and R2/R8.
deny = [
    { name = "tauri-plugin-updater" },
]
