[package]
name = "medasr-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MedASR desktop dictation app — Tauri 2 host process."

[lints]
workspace = true

[[bin]]
name = "medasr-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
medasr-lifecycle = { workspace = true }
medasr-types     = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
tauri            = { version = "2", features = ["tray-icon"] }
# Auto-updater plugin is intentionally NOT a dependency.

[features]
# Default features minimal; Tauri's heavy features are opt-in.
default = []
