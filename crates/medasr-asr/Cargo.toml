[package]
name = "medasr-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "sherpa-onnx Rust wrapper around the int8 MedASR-CTC model."

[lints]
workspace = true

[dependencies]
medasr-types         = { workspace = true }
medasr-secure-buffer = { workspace = true }
thiserror            = { workspace = true }
tracing              = { workspace = true }
tokio-util           = { workspace = true }

sherpa-onnx = { version = "1.13", default-features = false, features = ["static"] }

[features]
# `integration` enables tests that load real model files; gated to keep CI
# fast and avoid pulling 421 MB of weights on every PR.
integration = []
