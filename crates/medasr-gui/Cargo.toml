[package]
name = "medasr-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native egui-based UI for MedASR. Records audio, transcribes, displays in-app — no keystroke injection, no global hotkey."

[lints]
workspace = true

[[bin]]
name = "medasr-gui"
path = "src/main.rs"

[dependencies]
medasr-types         = { workspace = true }
medasr-secure-buffer = { workspace = true }
medasr-audio         = { workspace = true }
medasr-asr           = { workspace = true }
medasr-postprocess   = { workspace = true }
medasr-model         = { workspace = true }
medasr-paths         = { workspace = true }
tokio                = { workspace = true }
tokio-util           = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }

eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui   = "0.31"
rfd    = "0.14"
hound  = "3"
image  = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
